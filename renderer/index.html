<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>🍐/place</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background: linear-gradient(135deg, #21c437 0%, #0e4f15 100%);
        color: white;
      }
      .container {
        text-align: center;
      }
      h1 {
        font-size: 32px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      }
      #update-btn {
        display: none;
        margin-left: 12px;
        padding: 8px 16px;
        font-size: 14px;
        border: 2px solid white;
        border-radius: 8px;
        background: green;
        color: white;
        cursor: pointer;
      }
      #update-btn:hover {
        background: greenyellow;
      }
      #status {
        font-size: 13px;
        opacity: 0.8;
      }
      /* the canvas is 100x100 real pixels, scaled up; keep pixels crisp */
      #place {
        width: 600px;
        height: 600px;
        image-rendering: pixelated;
        border-radius: 4px;
        cursor: crosshair;
        box-shadow:
          2px 2px 8px rgba(0, 0, 0, 0.3),
          2px 2px 2px rgba(0, 0, 0, 0.3);
      }
      /* faint gridlines over the scaled canvas so cells are visible */
      #grid-lines {
        position: absolute;
        width: 600px;
        height: 600px;
        pointer-events: none;
        background-image:
          linear-gradient(to right, #00000011 1px, transparent 1px),
          linear-gradient(to bottom, #00000011 1px, transparent 1px);
        background-size:
          6px 6px,
          6px 6px;
      }
      #grid-wrap {
        position: relative;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 id="v">pear-place v</h1>
      <button id="update-btn">Apply update</button>
      <div id="grid-wrap">
        <canvas id="place" width="100" height="100"></canvas>
        <div id="grid-lines"></div>
      </div>
      <p id="status">100×100 · click to paint · placements replicate peer-to-peer</p>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
